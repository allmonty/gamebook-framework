name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/dart
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # Includes the conformance suite (test/conformance_test.dart).
      - run: dart test

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.7
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # Includes test/examples_test.dart: every example valid, with no warnings.
      - run: dart test
      # DOM smoke tests; the runner image ships Chrome.
      - run: dart test -p chrome test/browser
      - run: dart run tool/build.dart

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.23.0
      - run: python3 tools/check_schema.py site/examples/*/*.json starters/*/*.json
