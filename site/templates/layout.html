<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="icon" href="{{root}}assets/logo.jpeg">
<link rel="stylesheet" href="{{root}}css/site.css">
</head>
<body data-root="{{root}}">
<a class="skip" href="#main">{{nav.skip}}</a>
<header class="site-header">
  <a class="brand" href="{{root}}{{lang}}/index.html">
    <img src="{{root}}assets/logo.jpeg" alt="" width="32" height="32">
    <span class="brand-text"><span class="label">{{brand.kicker}}</span><span class="brand-name">Gamebook Framework</span></span>
  </a>
  <nav class="site-nav" aria-label="{{nav.label}}">
    <a href="{{root}}{{lang}}/tutorial/index.html">{{nav.tutorial}}</a>
    <a href="{{root}}{{lang}}/play.html">{{nav.play}}</a>
    <a href="https://github.com/allmonty/gamebook-framework">GitHub</a>
    <a class="coffee" href="https://buymeacoffee.com/allmonty" target="_blank" rel="noopener">{{nav.coffee}}</a>
    <a class="lang-switch label" href="{{root}}{{otherLang}}/{{path}}" hreflang="{{otherLang}}">{{nav.otherLanguage}}</a>
  </nav>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
  <p><a href="{{root}}{{lang}}/versions.html">{{footer.versions}}</a></p>
  <p>{{footer.license}}</p>
  <p class="muted">{{footer.trademarks}}</p>
  <p class="label">{{footer.made}}</p>
</footer>
<script id="gb-strings" type="application/json">{{player.json}}</script>
<script defer src="{{root}}js/main.dart.js"></script>
</body>
</html>
