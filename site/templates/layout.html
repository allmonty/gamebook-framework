<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{site.url}}{{lang}}/{{path}}">
<link rel="alternate" hreflang="{{lang}}" href="{{site.url}}{{lang}}/{{path}}">
<link rel="alternate" hreflang="{{otherLang}}" href="{{site.url}}{{otherLang}}/{{path}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{site.url}}{{lang}}/{{path}}">
<meta property="og:title" content="{{page.title.attr}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:image" content="{{site.url}}assets/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="{{social.image.alt}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.title.attr}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{site.url}}assets/social-preview.png">
<meta name="twitter:image:alt" content="{{social.image.alt}}">
<link rel="icon" href="{{root}}assets/logo.jpeg">
<link rel="stylesheet" href="{{root}}css/site.css">
</head>
<body data-root="{{root}}">
<a class="skip" href="#main">{{nav.skip}}</a>
<header class="site-header">
  <a class="brand" href="{{root}}{{lang}}/index.html">
    <img src="{{root}}assets/logo.jpeg" alt="" width="32" height="32">
    <span class="brand-text"><span class="label">{{brand.kicker}}</span><span class="brand-name">Gamebook Framework</span></span>
  </a>
  <nav class="site-nav" aria-label="{{nav.label}}">
    <a href="{{root}}{{lang}}/tutorial/index.html"{{nav.tutorial.current}}>{{nav.tutorial}}</a>
    <a href="{{root}}{{lang}}/starters.html"{{nav.starters.current}}>{{nav.starters}}</a>
    <a href="{{root}}{{lang}}/play.html"{{nav.play.current}}>{{nav.play}}</a>
    <a href="https://github.com/allmonty/gamebook-framework">GitHub</a>
    <a class="coffee" href="https://buymeacoffee.com/allmonty" target="_blank" rel="noopener">{{nav.coffee}}</a>
    <a class="lang-switch label" href="{{root}}{{otherLang}}/{{path}}" hreflang="{{otherLang}}" lang="{{otherLang}}" aria-label="{{nav.otherLanguage.name}}">{{nav.otherLanguage}}</a>
  </nav>
</header>
<main id="main">
<noscript><p class="noscript">{{nav.noscript}}</p></noscript>
{{content}}
</main>
<footer class="site-footer">
  <p><a href="{{root}}{{lang}}/versions.html">{{footer.versions}}</a></p>
  <p>{{footer.license}}</p>
  <p class="muted">{{footer.trademarks}}</p>
  <p class="label">{{footer.made}}</p>
</footer>
<script id="gb-strings" type="application/json">{{player.json}}</script>
<script defer src="{{root}}js/main.dart.js"></script>
</body>
</html>
